<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        
        body {
    font-family: Arial, Helvetica, sans-serif;
}

table {
    width: 500px;
    border-collapse: collapse;
}
 
.cabecalho {
    background-color: #444;
    color: white;
}

th, td {
    border: 2px solid black;
    padding: 10px;
    text-align: center;
}
    </style>
</head>
<body>
    <table>
    <thead>
        <tr>
            <th class="cabecalho" rowspan="2" scope="col">Área</th>
            <th class="cabecalho" rowspan="2" scope="col">Disciplinas</th>
            <th class="cabecalho" colspan="2" scope="colgroup">Notas</th>
            <th class="cabecalho" rowspan="2" scope="col">Média</th>
        </tr>
        <tr>
            <th class="cabecalho" scope="col">Nota 1</th>
            <th class="cabecalho" scope="col">Nota 2</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th class="subtitulo" rowspan="4" scope="rowgroup">Exatas</th>
            <th scope="row">Matemática</th>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th scope="row">Física</th>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th scope="row">Química</th>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th scope="row">Biologia</th>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th class="cabecalho" colspan="4">Média de Exatas</th>
            <th class="cabecalho">0.0</th>
        </tr>
        <tr>
            <th class="subtitulo" rowspan="2" scope="rowgroup">Humanas</th>
            <th scope="row">História</th>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th scope="row">Geografia</th>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th class="cabecalho" colspan="4">Média de Humanas</th>
            <th class="cabecalho">0.0</th>
        </tr>
    </tbody>
</table>
</body>
</html>
